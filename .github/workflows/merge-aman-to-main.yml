name: Auto Merge aman to main

on:
  push:
    branches:
      - aman

permissions:
  contents: write

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge aman into main
        run: |
          git merge origin/aman --no-edit

      - name: Push changes
        run: |
          git push origin main
